<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>許願池・客服｜凌的萬用pdf編輯器</title><link rel="stylesheet" href="css/site.css">
<style>
.tabs{display:flex;gap:8px;margin:6px 0 14px}
.tabs button{border:1px solid var(--line,#e5e7eb);background:#fff;border-radius:99px;padding:7px 16px;cursor:pointer;font-size:15px;position:relative}
.tabs button.on{background:#4338ca;color:#fff;border-color:#4338ca}
.nd{display:none;position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:11px;border-radius:99px;padding:1px 6px}
.nd.on{display:inline-block}
textarea.ta{width:100%;min-height:130px;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:10px;font:inherit;resize:vertical}
.pricein{display:flex;align-items:center;gap:6px}.pricein input{width:140px}
.note{font-size:13px;color:#6b7280}
.pn{display:block;margin-top:6px;color:#b45309}
.err{min-height:1.4em;margin-top:8px;color:#dc2626;font-size:14px}
.tk{border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff;position:relative}
.tk .hd{display:flex;justify-content:space-between;font-size:12.5px;color:#6b7280;margin-bottom:6px}
.tk .tx{white-space:pre-wrap;word-break:break-word}
.tk .pr{font-size:13px;color:#4338ca;margin-top:4px}
.stt{border-radius:99px;padding:1px 8px;font-size:12px}.stt.open{background:#fef3c7;color:#92400e}.stt.replied{background:#dcfce7;color:#166534}.stt.closed{background:#e5e7eb;color:#374151}
.msg{margin-top:8px;padding:8px 10px;border-radius:10px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg small{display:block;color:#6b7280;font-size:12px;margin-bottom:2px}
.msg.admin{background:#eef2ff}.msg.user{background:#f9fafb}
.fu{display:flex;gap:6px;margin-top:8px}.fu input{flex:1}
.tk .nd{top:-8px;right:10px}
</style></head>
<body>
<div id="siteHeader"></div>
<div class="wrap narrow">
  <h1 id="title">🌠 許願池</h1>
  <div class="tabs" id="tabs"><button data-t="wish">🌠 許願池<span class="nd" id="ndWish">新回覆</span></button><button data-t="bug">💬 客服・問題回報<span class="nd" id="ndBug">新回覆</span></button></div>
  <div class="card">
    <div id="intro"></div>
    <div id="loginBox" style="display:none;margin-top:12px"><p>要先用 Google 帳號登入，才能送出訊息，也才看得到回覆。</p><button class="btn primary" id="loginBtn">用 Google 登入</button></div>
    <div id="form" style="display:none;margin-top:12px">
      <label class="f"><span id="lbl"></span><textarea id="text" class="ta" maxlength="2000"></textarea></label>
      <div class="note" style="text-align:right" id="count">0 / 2000</div>
      <div id="priceBox">
        <label class="f"><span>如果這個願望實現，你願意花多少錢使用這項功能？</span>
          <div class="pricein"><span>NT$</span><input id="price" type="number" inputmode="numeric" min="0" max="100000" step="1" placeholder="例如 30"></div></label>
        <p class="note" style="margin:4px 0 0">可以不填；填 0 代表免費才會用。這只是讓我參考，不會向你收費。</p>
      </div>
      <button class="btn primary" id="send" style="margin-top:12px">送出</button>
      <div class="err" id="err"></div>
    </div>
  </div>
  <h2 id="histTitle"></h2>
  <div id="list"></div>
</div>
<footer><a href="privacy.html">隱私權政策</a><a href="terms.html">服務條款與退款</a><a href="pricing.html">方案與價格</a></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script>
/* 許願池・客服（參考 ar-pet）：訊息存在後端 tickets 資料表，管理後台（ops.html）可以看到、回覆、結案 */
App.header('wish.html'); const esc = App.esc, $ = id => document.getElementById(id), C = App.config;
const NOTE = `備註：${C.ownerNote || '此網站為個人經營，回覆較慢請見諒。'}`;
const TK = {
  wish: { title: '🌠 許願池', intro: '希望網站多什麼功能、哪裡可以更好用？請寫下你的願望，我會盡力完成。', label: '你的願望', ph: '例如：希望可以把 PDF 轉成 Markdown、希望可以一次蓋很多個印章…', hist: '我許過的願望', empty: '還沒有許過願望。', send: '🌠 送出願望' },
  bug: { title: '💬 客服・問題回報', intro: '遇到問題、轉檔失敗、付款沒有開通，都可以在這裡告訴我。寫得越詳細（用什麼瀏覽器、按了什麼、出現什麼訊息），越快找到原因。付款問題請附上訂單編號。', label: '請描述遇到的問題', ph: '例如：PDF 轉 Word 時跳出「轉檔失敗」，用的是手機 Chrome…', hist: '我送出的問題', empty: '還沒有送出過問題。', send: '送出' }
};
const ST = { open: ['等待回覆', 'open'], replied: ['已回覆', 'replied'], closed: ['已結案', 'closed'] };
let type = new URLSearchParams(location.search).get('t') === 'bug' ? 'bug' : 'wish', tickets = null, busy = false;
const tm = ms => ms ? App.fmtDate(ms, 1) : '';
function paint() {
  const c = TK[type]; document.title = c.title.replace(/^\S+\s/, '') + '｜' + (C.siteName || '');
  $('title').textContent = c.title;
  $('intro').innerHTML = esc(c.intro) + `<span class="pn">${esc(NOTE)}</span><span class="note" style="display:block;margin-top:4px">也可以來信：<a href="mailto:${esc(C.supportEmail)}">${esc(C.supportEmail)}</a></span>`;
  $('lbl').textContent = c.label; $('text').placeholder = c.ph; $('histTitle').textContent = c.hist; $('send').textContent = c.send;
  $('priceBox').style.display = type === 'wish' ? '' : 'none';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === type));
  $('loginBox').style.display = App.user ? 'none' : ''; $('form').style.display = App.user ? '' : 'none';
  for (const [t, id] of [['bug', 'ndBug'], ['wish', 'ndWish']]) $(id).classList.toggle('on', !!tickets?.some(k => k.type === t && k.user_unread));
  const list = $('list');
  if (!App.user) { list.innerHTML = '<p class="note">登入後就會看到你送出過的訊息和回覆。</p>'; return; }
  if (!tickets) { list.innerHTML = '<p class="note">讀取中…</p>'; return; }
  const mine = tickets.filter(t => t.type === type);
  if (!mine.length) { list.innerHTML = `<p class="note">${c.empty}</p>`; return; }
  list.innerHTML = mine.map(t => {
    const [lab, cls] = ST[t.status] || ST.open;
    const th = (t.thread || []).map(m => `<div class="msg ${m.by === 'admin' ? 'admin' : 'user'}"><small>${m.by === 'admin' ? '🧑‍💻 站長回覆' : '我補充'}・${tm(m.at)}</small>${esc(m.text)}</div>`).join('');
    const fu = t.status === 'closed' ? '<p class="note" style="margin:8px 0 0">這則已經結案。有新的問題請重新送出一則。</p>'
      : `<div class="fu"><input maxlength="1000" placeholder="補充說明…" data-fu="${esc(t.id)}"><button class="btn sm" data-fub="${esc(t.id)}">送出</button></div>`;
    return `<div class="tk"><span class="nd${t.user_unread ? ' on' : ''}">新回覆</span><div class="hd"><span>${tm(t.created_at)}</span><span class="stt ${cls}">${lab}</span></div>
      <div class="tx">${esc(t.text)}</div>${t.type === 'wish' && t.price != null ? `<div class="pr">願意花 NT$${esc(t.price)}</div>` : ''}${th}${fu}</div>`;
  }).join('');
  list.querySelectorAll('[data-fub]').forEach(b => b.onclick = () => followUp(b.dataset.fub, b));
  list.querySelectorAll('[data-fu]').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') followUp(i.dataset.fu, list.querySelector(`[data-fub="${i.dataset.fu}"]`)); });
  const unread = mine.filter(t => t.user_unread).map(t => t.id);
  if (unread.length) App.api('/api/support/read', { body: { ids: unread } }).then(() => { tickets.forEach(t => { if (unread.includes(t.id)) t.user_unread = false; }); }).catch(() => { });
}
async function load() { if (!App.user) return paint(); try { tickets = (await App.api('/api/support/mine', { body: {} })).tickets; } catch (e) { $('list').innerHTML = `<p class="err">讀不到之前的訊息（${esc(e.message)}）</p>`; return; } paint(); }
async function followUp(id, btn) {
  const inp = $('list').querySelector(`[data-fu="${id}"]`), text = inp && inp.value.trim(); if (!text || btn.disabled) return;
  btn.disabled = true;
  try { await App.api('/api/support/followup', { body: { id, text } }); await load(); } catch (e) { btn.disabled = false; alert('送出失敗：' + e.message); }
}
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; type = b.dataset.t; $('err').textContent = ''; history.replaceState(null, '', '?t=' + type); paint(); };
$('text').oninput = () => { $('count').textContent = $('text').value.length + ' / 2000'; };
$('loginBtn').onclick = () => App.signIn().then(u => u && location.reload()).catch(e => e.message !== '已取消登入' && alert(e.message));
$('send').onclick = async () => {
  if (busy) return; const text = $('text').value.trim(), err = $('err');
  if (text.length < 2) { err.textContent = type === 'wish' ? '請寫下你的願望' : '請描述遇到的問題'; $('text').focus(); return; }
  const pv = $('price').value.trim();
  if (type === 'wish' && pv && !(+pv >= 0 && +pv <= 100000)) { err.textContent = '金額請填 0～100000 之間的數字'; return; }
  busy = true; $('send').disabled = true; err.textContent = ''; $('send').textContent = '送出中…';
  try {
    await App.api('/api/support/create', { body: { type, text, price: type === 'wish' && pv ? Math.round(+pv) : null, device: `${navigator.userAgent}・螢幕 ${screen.width}×${screen.height}`.slice(0, 300) } });
    $('text').value = ''; $('price').value = ''; $('count').textContent = '0 / 2000'; await load();
    err.innerHTML = `<span style="color:#16a34a">✅ 已送出！${type === 'wish' ? '謝謝你的願望，' : ''}回覆後會顯示在下面。</span>`;
  } catch (e) { err.textContent = '送出失敗：' + e.message; }
  finally { busy = false; $('send').disabled = false; $('send').textContent = TK[type].send; }
};
paint(); App.ready.then(load);
</script>
</body></html>
