<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex">
<title>線上簽名</title>
<link rel="stylesheet" href="css/site.css">
<style>
body{background:#e9ecf2;padding-bottom:90px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px}
.top .org{font-size:13px;color:var(--muted)}.top h1{font-size:18px;margin:2px 0 0}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 10px}
.pg{position:relative;background:#fff;box-shadow:0 2px 12px rgba(15,23,42,.12);touch-action:pan-y}
.pg canvas{display:block;width:100%;height:100%}
.pg.placing{cursor:crosshair;outline:3px dashed var(--accent);outline-offset:2px}
.sig{position:absolute;border:1.5px dashed #2563eb;touch-action:none;cursor:move}
.sig img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.sig .rs{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;background:#fff;border:2px solid #2563eb;border-radius:4px;cursor:nwse-resize}
.sig .x{position:absolute;right:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:none;background:#ef4444;color:#fff;cursor:pointer;font-size:13px}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.dock .btn{font-size:15px;padding:10px 18px}
#pad{width:100%;aspect-ratio:5/2;border:1px solid var(--line);border-radius:10px;background:repeating-linear-gradient(0deg,#fff 0 calc(100% - 1px),#e5e7eb calc(100% - 1px) 100%);touch-action:none;display:block}
.center{max-width:520px;margin:40px auto;padding:0 16px}
.banner{max-width:900px;margin:14px auto 0;padding:0 10px}
#busy{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;place-items:center;z-index:120}#busy.on{display:grid}
#busy div{background:#fff;padding:20px 26px;border-radius:12px}
</style>
</head>
<body>
<div class="top"><div class="org" id="org"></div><h1 id="ttl">線上簽名</h1></div>
<div id="msg"></div>
<div id="pages"></div>
<div class="dock" id="dock" style="display:none"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div id="busy"><div id="busyMsg">處理中…</div></div>
<div id="toast"></div>

<footer><a href="privacy.html">隱私權政策</a><a href="terms.html">服務條款與退款</a></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s), esc = App.esc;
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const PJ = { cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true, standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/' };
const Q = new URLSearchParams(location.search);
const TOKEN = Q.get('t') || '', LINK = Q.get('b') || '';
let info = null, bytes = null, pdf = null, pages = [], sigs = [], sigImg = null, placing = false, openInfo = null;
let tT; function toast(m, ms = 4000) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), ms); }
const busy = m => { $('#busy').classList.toggle('on', !!m); if (m) $('#busyMsg').textContent = m; };
function modal(h) { $('#mbox').innerHTML = h; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
const show = h => { $('#msg').innerHTML = h; };
const go = t => location.replace('sign.html?t=' + encodeURIComponent(t));
function needLogin(hint) {
  show(`<div class="center card"><h3>請先用 Google 帳號登入</h3><p>${hint ? `這份文件只開放給 <b>${esc(hint)}</b>，請用對方通知你的那個 Google 帳號登入。` : '請用對方通知你的 Google 帳號登入。'}</p><p class="small muted">第一次使用的話，登入就會自動建立帳號，不用另外註冊。</p><button class="btn primary" id="lg">用 Google 登入</button></div>`);
  $('#lg').onclick = () => App.signIn().then(u => u && location.reload()).catch(er => er.message !== '已取消登入' && toast(er.message));
}
function wrongAccount(hint) {
  show(`<div class="center card"><h3>登入的帳號不對</h3><p>你現在登入的是 <b>${esc(App.user && App.user.email)}</b>${hint ? `，但這份文件只開放給 <b>${esc(hint)}</b>` : ''}。</p><button class="btn primary" id="sw">換一個帳號登入</button></div>`);
  $('#sw').onclick = async () => { await App.signOut(); };
}
function fail(e) {
  if (e.status === 401) return needLogin(e.data && e.data.hint);
  if (e.status === 403 && e.data && e.data.wrong_account) return wrongAccount(e.data.hint);
  show(`<div class="center card"><h3>無法開啟</h3><p class="muted">${esc(e.message)}</p></div>`);
}
function head(b) { $('#org').textContent = b.org || ''; $('#ttl').textContent = b.name || '線上簽名'; document.title = b.name || '線上簽名'; }
async function loadPdf(path) {
  busy('文件載入中…');
  try { const r = await App.api(path, { raw: true }); bytes = new Uint8Array(await r.arrayBuffer()); pdf = await pdfjsLib.getDocument({ data: bytes.slice(), ...PJ }).promise; }
  catch (e) { busy(false); show(`<div class="center card"><h3>文件載入失敗</h3><p class="muted">${esc(e.message)}</p></div>`); return false; }
  await render(); busy(false); return true;
}

async function start() {
  if (!TOKEN && !LINK) return show('<div class="center card"><h3>網址不完整</h3><p class="muted">請把對方給你的完整網址貼到瀏覽器。</p></div>');
  await App.ready;
  if (LINK) return join();
  try { info = await App.api('/api/sign/' + encodeURIComponent(TOKEN)); } catch (e) { return fail(e); }
  head(info.batch);
  if (await loadPdf(`/api/sign/${encodeURIComponent(TOKEN)}/file`)) setupDock();
}
/* ---------- 共用網址：登入後帶到自己要簽的那份 ---------- */
async function join() {
  if (!App.user) return needLogin();
  let j; try { j = await App.api('/api/join/' + encodeURIComponent(LINK)); } catch (e) { return fail(e); }
  head(j.batch);
  if (j.batch.mode === 'open') return joinOpen(j);
  if (j.docs.length === 1) return go(j.docs[0].token);
  if (!j.docs.length) {
    show(`<div class="center card"><h3>名單上沒有你的帳號</h3><p>你現在登入的是 <b>${esc(j.email)}</b>，但「${esc(j.batch.name)}」的簽名名單上沒有這個 Email。</p><p class="small muted">如果你有別的 Google 帳號，請換那個帳號登入；不確定的話，請問發給你網址的人是用哪個 Email 登記的。</p><button class="btn primary" id="sw">換一個帳號登入</button></div>`);
    $('#sw').onclick = async () => { await App.signOut(); }; return;
  }
  const st = d => d.done ? '<span class="pill st-signed">全部簽好了</span>' : d.my_turn ? '<span class="pill st-sent">輪到你簽</span>' : d.my_done ? '<span class="pill">你已簽好，等其他人</span>' : `<span class="pill">等「${esc(d.waiting)}」先簽</span>`;
  show(`<div class="center card" style="max-width:640px"><h3>你有 ${j.docs.length} 份文件</h3><p class="small muted">${esc(j.email)}・點一下文件就可以打開</p>
    ${j.docs.map(d => `<a class="row" href="sign.html?t=${encodeURIComponent(d.token)}" style="justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;text-decoration:none;color:inherit"><span style="word-break:break-all">${esc(d.filename)}${d.total > 1 ? `<span class="small muted">（${d.cur}／${d.total} 人已簽）</span>` : ''}</span>${st(d)}</a>`).join('')}</div>`);
}
async function joinOpen(j) {
  if (j.mine) return go(j.mine.token);
  if (!j.has_file) return show('<div class="center card"><h3>還不能簽</h3><p class="muted">發起人還沒放上要簽的文件，請晚一點再打開這個網址。</p></div>');
  if (j.expired) return show(`<div class="center card"><h3>已經截止</h3><p class="muted">這份連署已經在 ${App.fmtDate(j.batch.deadline)} 截止了。</p></div>`);
  if (j.full) return show(`<div class="center card"><h3>名額已滿</h3><p class="muted">這份連署最多 ${j.max} 人，已經額滿了。</p></div>`);
  openInfo = j;
  info = { filename: j.filename, batch: j.batch, my_turn: true, signers: [], student_name: j.name };
  if (await loadPdf(`/api/join/${encodeURIComponent(LINK)}/file`)) setupDock();
}
function progress() {
  const s = info.signers || []; if (s.length < 2) return '';
  const n = '①②③④⑤';
  return `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${s.map((x, i) => `<span class="pill ${x.done ? 'st-signed' : i === info.cur ? 'st-sent' : ''}">${n[i] || i + 1} ${x.me ? '你' : esc(x.name)}${x.done ? ' ✔ 已簽' : i === info.cur ? '（現在輪到' + (x.me ? '你' : '這位') + '）' : ''}</span>`).join('')}</div>`;
}
function setupDock() {
  const d = $('#dock'); d.style.display = 'flex';
  const many = (info.signers || []).length > 1;
  const dl = (label, suffix) => { d.innerHTML = `<button class="btn" id="dl">${label}</button>`; $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); a.download = info.filename.replace(/(\.pdf)?$/i, suffix + '.pdf'); a.click(); }; };
  if (info.done) {
    show(`<div class="banner"><div class="notice ok">✔ ${many ? `${info.signers.length} 位都簽好了，文件已鎖定。` : `你已經在 ${App.fmtDate(info.my_signed_at || info.signed_at, 1)} 完成簽名並回傳，文件已鎖定，不能再修改。`}下面是簽好的文件。${progress()}</div></div>`);
    return dl('下載簽好的文件', '(已簽)');
  }
  if (!info.my_turn) {
    const w = info.signers[info.cur];
    show(`<div class="banner"><div class="notice info">${info.my_signed_at ? `✔ 你已經在 ${App.fmtDate(info.my_signed_at, 1)} 簽好了，現在等「${esc(w.name)}」接著簽。下面是目前的文件。` : `還沒輪到你：要等「${esc(w.name)}」先簽，簽好之後再打開這個網址就可以簽了。下面是目前的文件，可以先看內容。`}${progress()}</div></div>`);
    if (info.my_signed_at) return dl('下載目前的文件', '(簽名中)');
    d.style.display = 'none'; return;
  }
  if (info.expired) { show(`<div class="banner"><div class="notice err">已經超過簽名期限（${App.fmtDate(info.batch.deadline)}），請聯絡發起人。</div></div>`); d.style.display = 'none'; return; }
  const who = info.student_name ? esc(info.student_name) + ' ' : '';
  const intro = openInfo ? `這是一份連署，目前已經有 <b>${openInfo.count}</b> 人簽了${openInfo.max ? `（最多 ${openInfo.max} 人）` : ''}。` : many && info.cur > 0 ? '前面的人已經簽好了，你會看到他們的簽名。' : '';
  show(`<div class="banner">${info.status === 'returned' ? `<div class="notice err">發起人退回了這份文件，請重新簽名。${info.return_reason ? '<br>原因：' + esc(info.return_reason) : ''}</div>` : ''}
    <div class="notice info">${who}你好：${intro}請先確認下面的文件內容，然後按「簽名」，在文件上要簽名的位置點一下。可以拖曳移動、拉右下角調整大小。確定後按「我簽好了，回傳」。${info.batch.deadline ? `<br>請在 <b>${App.fmtDate(info.batch.deadline)}</b> 前完成。` : ''}${info.batch.message ? `<div style="white-space:pre-wrap;margin-top:6px">${esc(info.batch.message)}</div>` : ''}${progress()}</div></div>`);
  d.innerHTML = `<button class="btn" id="bSig">✍ 簽名</button><button class="btn primary" id="bDone" disabled>我簽好了，回傳</button>`;
  $('#bSig').onclick = openPad; $('#bDone').onclick = confirmSubmit;
}
async function render() {
  const wrap = $('#pages'); wrap.innerHTML = ''; pages = [];
  const W = Math.min(900, document.documentElement.clientWidth - 20);
  for (let i = 1; i <= pdf.numPages; i++) {
    const pp = await pdf.getPage(i); const v1 = pp.getViewport({ scale: 1 }); const k = W / v1.width;
    const dpr = Math.min(2, window.devicePixelRatio || 1); const vp = pp.getViewport({ scale: k * dpr });
    const el = document.createElement('div'); el.className = 'pg'; el.style.width = W + 'px'; el.style.height = v1.height * k + 'px';
    const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height); el.appendChild(c); wrap.appendChild(el);
    await pp.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const P = { i: i - 1, pp, v1, k, el }; pages.push(P);
    el.addEventListener('click', e => { if (!placing || e.target.closest('.sig')) return; const r = el.getBoundingClientRect(); placeSig(P, (e.clientX - r.left) / k, (e.clientY - r.top) / k); });
  }
  sigs.forEach(drawSig);
}
/* ---------- 簽名板 ---------- */
function openPad() {
  modal(`<h3>請在框裡簽名</h3><canvas id="pad" width="1000" height="400"></canvas>
  <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn" id="pClr">清除重寫</button><div class="row"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="pOk">完成</button></div></div>`);
  const c = $('#pad'), x = c.getContext('2d'); x.lineWidth = 6; x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#111'; let drawing = false, any = false, last = null;
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { drawing = true; any = true; last = pt(e); c.setPointerCapture(e.pointerId); x.beginPath(); x.arc(last[0], last[1], 3, 0, 7); x.fill(); };
  c.onpointermove = e => { if (!drawing) return; const p = pt(e); x.beginPath(); x.moveTo(last[0], last[1]); x.lineTo(p[0], p[1]); x.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => drawing = false;
  $('#pClr').onclick = () => { x.clearRect(0, 0, c.width, c.height); any = false; };
  $('#pOk').onclick = () => {
    if (!any) return toast('請先簽名');
    const t = trim(c); if (!t) return toast('請先簽名');
    sigImg = { url: t.toDataURL('image/png'), ratio: t.width / t.height }; closeModal();
    placing = true; document.querySelectorAll('.pg').forEach(p => p.classList.add('placing'));
    toast('請在文件上要簽名的位置點一下', 6000);
  };
}
function trim(c) {
  const x = c.getContext('2d'), d = x.getImageData(0, 0, c.width, c.height).data; let a = c.width, b = c.height, r = 0, t = 0;
  for (let y = 0; y < c.height; y++) for (let X = 0; X < c.width; X++) if (d[(y * c.width + X) * 4 + 3] > 10) { if (X < a) a = X; if (X > r) r = X; if (y < b) b = y; if (y > t) t = y; }
  if (r <= a || t <= b) return null; const o = document.createElement('canvas'); o.width = r - a + 12; o.height = t - b + 12;
  o.getContext('2d').drawImage(c, a - 6, b - 6, o.width, o.height, 0, 0, o.width, o.height); return o;
}
function placeSig(P, x, y) {
  placing = false; document.querySelectorAll('.pg').forEach(p => p.classList.remove('placing'));
  const w = Math.min(160, P.v1.width * 0.3), h = w / sigImg.ratio;
  const s = { id: Math.random().toString(36).slice(2), page: P.i, url: sigImg.url, x: Math.max(0, x - w / 2), y: Math.max(0, y - h / 2), w, h };
  sigs.push(s); drawSig(s); $('#bDone').disabled = false;
}
function drawSig(s) {
  const P = pages[s.page]; if (!P) return; let el = document.getElementById('s' + s.id);
  if (!el) {
    el = document.createElement('div'); el.className = 'sig'; el.id = 's' + s.id; el.innerHTML = `<img src="${s.url}"><div class="rs"></div><button class="x" title="刪除">✕</button>`; P.el.appendChild(el);
    el.querySelector('.x').onclick = e => { e.stopPropagation(); sigs = sigs.filter(z => z !== s); el.remove(); $('#bDone').disabled = !sigs.length; };
    let mode = null, sx, sy, o;
    el.onpointerdown = e => { if (e.target.classList.contains('x')) return; e.preventDefault(); mode = e.target.classList.contains('rs') ? 'rs' : 'mv'; sx = e.clientX; sy = e.clientY; o = { ...s }; el.setPointerCapture(e.pointerId); };
    el.onpointermove = e => { if (!mode) return; const dx = (e.clientX - sx) / P.k, dy = (e.clientY - sy) / P.k;
      if (mode === 'mv') { s.x = Math.max(0, Math.min(P.v1.width - s.w, o.x + dx)); s.y = Math.max(0, Math.min(P.v1.height - s.h, o.y + dy)); }
      else { const w = Math.max(30, Math.min(P.v1.width - s.x, o.w + dx)); s.w = w; s.h = w * o.h / o.w; }
      pos(); };
    el.onpointerup = el.onpointercancel = () => mode = null;
  }
  const pos = () => { el.style.left = s.x * P.k + 'px'; el.style.top = s.y * P.k + 'px'; el.style.width = s.w * P.k + 'px'; el.style.height = s.h * P.k + 'px'; };
  pos();
}
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (pdf) render(); }, 300); });
/* ---------- 回傳 ---------- */
function confirmSubmit() {
  if (!sigs.length) return toast('請先簽名');
  const next = info.signers && info.signers[info.cur + 1];
  modal(`<h3>確定要回傳嗎？</h3><p>按下「確定回傳」後，簽名就會鎖定，<b>之後不能再修改</b>。如果有錯，要請發起人退回才能重簽。${next ? `<br>回傳後就換「${esc(next.name)}」接著簽。` : ''}</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">再檢查一下</button><button class="btn primary" id="cGo">確定回傳</button></div>`);
  $('#cGo').onclick = submit;
}
async function submit() {
  closeModal(); busy('正在合成簽名並回傳…');
  try {
    const { PDFDocument, degrees } = PDFLib;
    const doc = await PDFDocument.load(bytes, { ignoreEncryption: true }); const pl = doc.getPages(); const cache = {};
    for (const s of sigs) {
      const P = pages[s.page]; const page = pl[s.page];
      const png = cache[s.url] || (cache[s.url] = await doc.embedPng(await (await fetch(s.url)).arrayBuffer()));
      const p = P.v1.convertToPdfPoint(s.x, s.y + s.h);
      page.drawImage(png, { x: p[0], y: p[1], width: s.w, height: s.h, rotate: degrees(P.pp.rotate) });
    }
    const out = await doc.save();
    const r = await App.api(LINK ? `/api/join/${encodeURIComponent(LINK)}/submit` : `/api/sign/${encodeURIComponent(TOKEN)}/submit`, { body: new Blob([out], { type: 'application/pdf' }), headers: { 'Content-Type': 'application/pdf' } });
    busy(false); sigs = []; if (LINK && r.token) return go(r.token); location.reload();
  } catch (e) { busy(false); toast('回傳失敗：' + e.message, 8000); if (e.status === 409) setTimeout(() => (e.data && e.data.token ? go(e.data.token) : location.reload()), 1500); }
}
start();
</script>
</body>
</html>
